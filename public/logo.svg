<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#12121A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#FF2D6B"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.5"/>

  <!-- Gamepad body -->
  <path d="M156 200 C156 178 174 160 196 160 L316 160 C338 160 356 178 356 200 L356 260 C356 282 338 300 316 300 L280 300 L270 340 C266 356 246 356 242 340 L232 300 L196 300 C174 300 156 282 156 260 Z" fill="#1A1A25" stroke="#00F0FF" stroke-width="4"/>

  <!-- Left stick / D-pad -->
  <rect x="192" y="218" width="40" height="8" rx="4" fill="#00F0FF"/>
  <rect x="208" y="202" width="8" height="40" rx="4" fill="#00F0FF"/>

  <!-- Right buttons -->
  <circle cx="310" cy="210" r="8" fill="#FF2D6B"/>
  <circle cx="330" cy="230" r="8" fill="#00F0FF"/>
  <circle cx="290" cy="230" r="8" fill="#00F0FF" opacity="0.6"/>
  <circle cx="310" cy="250" r="8" fill="#FF2D6B" opacity="0.6"/>

  <!-- Price tag / discount badge -->
  <g transform="translate(320, 100) rotate(15)">
    <rect width="80" height="50" rx="10" fill="#FF2D6B"/>
    <text x="40" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="white">%</text>
  </g>

  <!-- "SDH" text -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="72" fill="#00F0FF" letter-spacing="8">SDH</text>
</svg>
